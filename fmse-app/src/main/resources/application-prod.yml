spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    properties:
      hibernate:
        show_sql: false
        format_sql: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: { GOOGLE_CLIENT_ID }
            client-secret: { GOOGLE_CLIENT_SECRET }
            scope:
              - email
              - profile

security:
  jwt:
    secret-key: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:86400000}

